/* =========================================================
   COMMIT GRAPH
   頂点 = コミット、名札 = ブランチ、HEAD = 今いるブランチ
   ops 文字列: c:メッセージ / b:名前 / s:名前 / sc:名前 / m:名前 / M:名前(GitHub の Merge) / d:名前
   ========================================================= */
const GID=['3f2a1b9','5a7b9f3','c91e4d0','8d4e2a0','e41c0d2','9b7a3f1','a2f05c8','71cd9e4','b5e3a17','04fa6b2','6e2d8c1','d3b84f0','1c57e9a','f8a92d3','29e6b0c','7b0c4e5','5d19fa2','e07b3c6'];
class GitGraph{
  constructor(){ this.commits=[]; this.branches={main:null}; this.head='main'; this.lanes={main:0}; }
  copy(){ const g=new GitGraph(); g.commits=this.commits.map(c=>({...c,parents:[...c.parents]})); g.branches={...this.branches}; g.head=this.head; g.lanes={...this.lanes}; return g; }
  nid(){ return GID[this.commits.length]||Math.random().toString(16).slice(2,9).padEnd(7,'0'); }
  get(id){ return this.commits.find(c=>c.id===id); }
  isAnc(a,b){ // a が b の祖先（または同じ）か
    if(!a||!b) return false;
    const st=[b], seen=new Set();
    while(st.length){ const x=st.pop(); if(x===a) return true; if(seen.has(x)) continue; seen.add(x); st.push(...this.get(x).parents); }
    return false;
  }
  freeLane(){ const used=new Set(Object.keys(this.branches).map(b=>this.lanes[b])); let l=0; while(used.has(l)) l++; return l; }
  commit(msg){
    const p=this.branches[this.head], id=this.nid();
    msg=msg||`コミット${this.commits.length+1}`;
    this.commits.push({id,msg,parents:p?[p]:[],lane:this.lanes[this.head],x:this.commits.length});
    this.branches[this.head]=id;
    return {ok:true,out:[`[${this.head}${p?'':' (root-commit)'} ${id}] ${msg}`],note:`新しい頂点 ${id.slice(0,4)} ができ、HEAD が付いている ${this.head} の名札だけがそこへ進みました。`};
  }
  branch(name){
    if(!/^[A-Za-z0-9._\/-]+$/.test(name)) return {out:[`fatal: '${name}' is not a valid branch name`],note:'ブランチ名には英数字と - _ . / が使えます（空白は使えません）。'};
    if(name in this.branches) return {out:[`fatal: a branch named '${name}' already exists`],note:'同じ名前のブランチがすでにあります。'};
    this.lanes[name]=this.freeLane(); this.branches[name]=this.branches[this.head];
    return {ok:true,out:[],note:''};
  }
  sw(name){
    if(!(name in this.branches)) return {out:[`fatal: invalid reference: ${name}`]};
    if(name===this.head) return {out:[`Already on '${name}'`],note:`すでに ${name} にいます。`};
    this.head=name;
    return {ok:true,out:[`Switched to branch '${name}'`],note:`HEAD が ${name} に移りました。ワークツリーの中身は、${name} が指す頂点の状態に入れ替わります。`};
  }
  sc(name){
    const r=this.branch(name); if(!r.ok) return r;
    this.head=name;
    return {ok:true,out:[`Switched to a new branch '${name}'`],note:`今いる頂点に ${name} という名札を付けて、HEAD をそこへ移しました。頂点はまだ増えていません。`};
  }
  merge(name,noff=false){
    if(!(name in this.branches)) return {out:[`merge: ${name} - not something we can merge`]};
    const t=this.branches[name], h=this.branches[this.head];
    if(this.isAnc(t,h)) return {out:['Already up to date.'],note:`${name} の頂点は、すでに ${this.head} からたどれます。取り込むものはありません。`};
    if(!noff && this.isAnc(h,t)){
      this.branches[this.head]=t;
      return {ok:true,ff:true,out:[`Updating ${h}..${t}`,'Fast-forward'],note:`${this.head} は進んでいなかったので、名札を ${name} の位置まで進めるだけで合流できました（早送り）。頂点は増えていません。`};
    }
    const id=this.nid();
    this.commits.push({id,msg:noff?`Merge pull request from ${name}`:`Merge branch '${name}'`,parents:[h,t],lane:this.lanes[this.head],x:this.commits.length});
    this.branches[this.head]=id;
    return {ok:true,mc:true,out:["Merge made by the 'ort' strategy."],note:`両方のブランチが進んでいたので、親を2つ持つ新しい頂点（マージコミット）ができました。`};
  }
  del(name){
    if(!(name in this.branches)) return {out:[`error: branch '${name}' not found`]};
    if(name===this.head) return {out:[`error: cannot delete branch '${name}' used by worktree at '/home/taro/mysite'`],note:'今いるブランチは削除できません。先に別のブランチへ switch しましょう。'};
    const t=this.branches[name];
    if(!this.isAnc(t,this.branches[this.head])) return {out:[`error: the branch '${name}' is not fully merged.`],note:`${name} には、まだ ${this.head} に合流していない頂点があります。名札を外すとそこへたどり着けなくなるので、Git が止めました。`};
    delete this.branches[name];
    return {ok:true,del:true,out:[`Deleted branch ${name} (was ${t}).`],note:'名札を外しました。頂点（コミット）はそのまま残っています。'};
  }
  run(script){
    const OPS={c:a=>this.commit(a),b:a=>this.branch(a),s:a=>this.sw(a),sc:a=>this.sc(a),m:a=>this.merge(a),M:a=>this.merge(a,true),d:a=>this.del(a)};
    script.split(';').map(x=>x.trim()).filter(Boolean).forEach(tok=>{ const i=tok.indexOf(':'); OPS[i<0?tok:tok.slice(0,i)](i<0?'':tok.slice(i+1)); });
    return this;
  }
}
function graphHTML(g,{hl=new Set(),moved=new Set()}={}){
  const DX=58,X0=40,Y0=74,DY=80;
  const lanes=g.commits.map(c=>c.lane);
  const maxLane=Math.max(0,...lanes);
  const W=X0*2+Math.max(0,g.commits.length-1)*DX+30, H=Y0+maxLane*DY+34;
  const P=c=>({x:X0+c.x*DX,y:Y0+c.lane*DY});
  let edges='',nodes='',tags='';
  g.commits.forEach(c=>{ const a=P(c); c.parents.forEach(pid=>{ const b=P(g.get(pid));
    const d=a.y===b.y?`M${b.x} ${b.y}L${a.x} ${a.y}`:`M${b.x} ${b.y}C${b.x+DX*.7} ${b.y} ${a.x-DX*.7} ${a.y} ${a.x} ${a.y}`;
    edges+=`<path d="${d}" class="ge ${hl.has(c.id)?'new':''}"/>`; }); });
  const headId=g.branches[g.head];
  g.commits.forEach(c=>{ const a=P(c);
    nodes+=`<g class="gn ${hl.has(c.id)?'new':''} ${c.id===headId?'cur':''}"><circle cx="${a.x}" cy="${a.y}" r="9"/><text x="${a.x}" y="${a.y+26}">${c.id.slice(0,4)}</text><title>${esc(c.msg)}</title></g>`; });
  const byC={};
  Object.keys(g.branches).forEach(b=>{ const id=g.branches[b]; if(id) (byC[id]=byC[id]||[]).push(b); });
  Object.entries(byC).forEach(([id,bs])=>{
    bs.sort((x,y)=>(y===g.head)-(x===g.head)||(y==='main')-(x==='main'));
    const a=P(g.get(id));
    bs.forEach((b,k)=>{ const head=b===g.head;
      tags+=`<span class="gtag ${head?'head':''} ${moved.has(b)?'moved':''}" data-b="${esc(b)}" style="left:${a.x}px;top:${a.y-34-k*22}px">${head?'<i>HEAD→</i>':''}${esc(b)}</span>`; });
  });
  return `<div class="gcanvas" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" aria-hidden="true">${edges}${nodes}</svg>${tags}</div>`;
}
function enhanceGraphs(root){
  $$('.gfx',root).forEach(el=>{ el.innerHTML=`<div class="gwrap">${graphHTML(new GitGraph().run(el.dataset.ops))}</div>`; });
  $$('.gstx',root).forEach(el=>{
    const b=new GitGraph().run(el.dataset.before), a=b.copy().run(el.dataset.op);
    const hl=new Set(a.commits.filter(c=>!b.get(c.id)).map(c=>c.id));
    const moved=new Set(Object.keys(a.branches).filter(k=>!(k in b.branches)||a.branches[k]!==b.branches[k]||(k===a.head&&a.head!==b.head)));
    el.innerHTML=`<p class="stl">BEFORE</p><div class="gwrap">${graphHTML(b)}</div><div class="scmd"><span>↓</span><code>${esc(el.dataset.cmd)}</code></div><p class="stl ac">AFTER</p><div class="gwrap">${graphHTML(a,{hl,moved})}</div>`;
  });
}

/* ブランチシミュレーター */
function BranchSim(el){
  let g, term, note, flags, featCommits;
  function reset(){
    g=new GitGraph(); g.commit('最初のコミット');
    term=[]; flags={}; featCommits=0;
    note='まずは名前欄を feature のまま「git switch -c」を押してみましょう。';
  }
  reset();
  const NAMES=['feature','fix-header','add-photo','topic'];
  function suggest(){ return NAMES.find(n=>!(n in g.branches))||''; }
  function render(prev){
    const wrap=$('.gwrap',el);
    wrap.innerHTML=graphHTML(g,{hl:prev?new Set(g.commits.filter(c=>!prev.get(c.id)).map(c=>c.id)):new Set()});
    wrap.scrollLeft=wrap.scrollWidth;
    const sel=$('select',el), cur=sel.value;
    const others=Object.keys(g.branches);
    sel.innerHTML=others.map(b=>`<option ${b===cur?'selected':''}>${esc(b)}</option>`).join('');
    if(!others.includes(cur)) sel.value=others.find(b=>b!==g.head)||g.head;
    $('.bhead',el).innerHTML=`<span>HEAD → <b>${esc(g.head)}</b></span><span>頂点 ${g.commits.length}</span><span>名札 ${others.length}</span>`;
    $('.sim-note',el).textContent=note;
    const tb=$('.term-b',el);
    tb.innerHTML=term.length?termHTML(term):'<span class="ln out">ここに git の出力が表示されます</span>';
    tb.scrollTop=tb.scrollHeight;
    $('[data-op=sc]',el).disabled=Object.keys(g.branches).length>=4;
    $('[data-op=commit]',el).disabled=g.commits.length>=16;
    const m=$('#bmission');
    if(m) $$('li',m).forEach(li=>li.classList.toggle('ok',!!flags[li.dataset.m]));
  }
  function act(op){
    const prev=g.copy();
    const before={}; $$('.gtag',el).forEach(t=>before[t.dataset.b]={l:parseFloat(t.style.left),t:parseFloat(t.style.top)});
    const name=$('select',el).value, input=$('.sim-commit input',el);
    let r, cmd;
    if(op==='commit'){ cmd=`git commit -m "コミット${g.commits.length+1}"`; r=g.commit(); if(g.head!=='main'){ featCommits++; if(featCommits>=2) flags[2]=true; } }
    if(op==='sc'){ const n=input.value.trim(); cmd=`git switch -c ${n}`; r=g.sc(n); if(r.ok){ flags[1]=true; featCommits=0; input.value=suggest(); } }
    if(op==='sw'){ cmd=`git switch ${name}`; r=g.sw(name); }
    if(op==='merge'){ cmd=`git merge ${name}`; r=g.merge(name); if(r.ff) flags[3]=true; if(r.mc) flags[4]=true; }
    if(op==='del'){ cmd=`git branch -d ${name}`; r=g.del(name); if(r.del) flags[5]=true; }
    term.push('$ '+cmd, ...r.out); term=term.slice(-60);
    note=r.note||(r.ok?'':'このコマンドは実行できませんでした。出力を読んでみましょう。');
    render(prev);
    if(!A()) return;
    $$('.gtag',el).forEach(t=>{ const b=before[t.dataset.b], l=parseFloat(t.style.left), tp=parseFloat(t.style.top);
      if(!b) anime({targets:t,opacity:[0,1],translateY:[-10,0],duration:400,easing:'easeOutQuart'});
      else if(b.l!==l||b.t!==tp) anime({targets:t,left:[b.l,l],top:[b.t,tp],duration:600,easing:'easeInOutQuart'}); });
    const nn=$$('.gn.new',el); if(nn.length) anime({targets:nn,scale:[.2,1],opacity:[0,1],duration:500,easing:'easeOutBack'});
  }
  el.className='bsim';
  el.innerHTML=`
    <div class="sim-bar">
      <button data-op="commit">git commit</button>
      <span class="sim-commit"><input type="text" value="feature" maxlength="20" aria-label="新しいブランチ名" spellcheck="false"><button data-op="sc">git switch -c</button></span>
      <span class="bsel"><select aria-label="対象のブランチ"></select><button data-op="sw">git switch</button><button data-op="merge">git merge</button><button data-op="del">git branch -d</button></span>
      <button class="reset" data-op="reset">リセット</button>
    </div>
    <div class="bhead"></div>
    <div class="gwrap"></div>
    <div class="sim-note"></div>
    <div class="term"><div class="term-h"><span>SIMULATED TERMINAL</span></div><div class="term-b"></div></div>`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('button[data-op]'); if(!b||b.disabled) return;
    if(b.dataset.op==='reset'){ reset(); $('.sim-commit input',el).value='feature'; render(); return; }
    act(b.dataset.op);
  });
  $('.sim-commit input',el).addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) act('sc'); });
  render();
}

/* ページごとの図のアニメーション */
const ANIMS={
  route(){},
  overwrite(root){
    if(!A()) return;
    $$('svg g[class^=ow]',root).forEach(g=>g.style.opacity=0);
    anime.timeline({easing:'easeInOutQuad'})
      .add({targets:'.ow-1',opacity:[0,1],duration:400})
      .add({targets:['.ow-l1','.ow-l2'],strokeDashoffset:[anime.setDashoffset,0],duration:500})
      .add({targets:['.ow-a','.ow-b'],opacity:[0,1],duration:400,delay:anime.stagger(150)})
      .add({targets:['.ow-l3','.ow-l4'],strokeDashoffset:[anime.setDashoffset,0],duration:500,delay:anime.stagger(400)})
      .add({targets:'.ow-f',opacity:[0,1],duration:400})
      .add({targets:'.ow-x',opacity:[0,1],duration:300})
      .add({targets:'.ow-x line',strokeWidth:[8,3],duration:400},'-=300');
  },
  areas(root){
    const areas=$$('.area',root), arrows=$$('.aarrow',root);
    let i=0;
    function step(){
      if(!root.isConnected) return;
      areas.forEach((a,k)=>a.classList.toggle('lit',k===i));
      arrows.forEach((a,k)=>a.classList.toggle('lit',k===i));
      i=(i+1)%areas.length;
      setTimeout(step,1300);
    }
    step();
  },
  chain(root){
    if(!A()) return;
    $$('.ch-n circle',root).forEach(c=>{c.style.transformBox='fill-box';c.style.transformOrigin='center';});
    $$('.ch-ah,.ch-tag',root).forEach(e=>e.style.opacity=0);
    anime.timeline({easing:'easeOutQuart'})
      .add({targets:$$('.ch-n',root),opacity:[0,1],duration:400,delay:anime.stagger(450)})
      .add({targets:$$('.ch-e',root),strokeDashoffset:[anime.setDashoffset,0],duration:500,delay:anime.stagger(200)},400)
      .add({targets:$$('.ch-ah',root),opacity:[0,1],duration:200})
      .add({targets:$$('.ch-tag',root),opacity:[0,1],translateY:[-12,0],duration:500});
  },
  keys(root){
    if(!A()) return;
    const pub=$('.kchip.pub2',root);
    anime.timeline({easing:'easeOutQuart'})
      .add({targets:$$('.kchip.sec,.kchip.pub',root),opacity:[0,1],translateX:[-10,0],duration:400,delay:anime.stagger(200)})
      .add({targets:$('.keys .mid i',root),opacity:[0,1],duration:300})
      .add({targets:pub,opacity:[0,1],translateX:[-30,0],duration:600});
  },
  loop(root){
    if(!A()) return;
    $$('.loop',root).forEach(l=>anime({targets:l.children,backgroundColor:['#1a1a1a','#fbfaf7'],color:['#f4f2ec','#1a1a1a'],duration:700,delay:anime.stagger(300,{start:300}),easing:'easeOutQuad'}));
  }
};

let PQ={filter:0,i:0,wrong:0};
const pad2=n=>String(n).padStart(2,'0');
const refLink=r=>r?`<p class="pq-ref"><a href="#/${r}">→ 第${r.slice(2,4)}章で復習する</a></p>`:'';
function renderPractice(){
  store.practice=store.practice||{};
  const res=store.practice;
  const list=PRACTICE.filter(q=>!PQ.filter||q.cat===PQ.filter);
  PQ.i=Math.max(0,Math.min(PQ.i,list.length-1)); PQ.wrong=0;
  const q=list[PQ.i];
  const solved=()=>PRACTICE.filter(x=>res[x.id]==='ok').length;
  const kind=q.type==='input'?'INPUT — コマンドを入力':q.kind==='PREDICT'?'PREDICT — 結果を予想':'SELECT — 正しいものを選ぶ';
  const isCmd=c=>/^(git|ssh|cat) /.test(c);
  app.innerHTML=`
  <div class="wrap chapter">
    <aside class="ch-side">
      <p class="ch-part">EXTRA</p><p class="ch-no">+</p><h1 class="ch-title">コマンド練習</h1>
      <p class="pq-score"><b id="pqs">${solved()}</b>/ ${PRACTICE.length} 正解</p>
      <p class="pq-help">コマンドを暗記する練習ではありません。<b>「今どういう状態で、何をしたいか」</b>から、使うコマンドを考えましょう。わからなければ、問題の下のリンクから章に戻って OK です。</p>
    </aside>
    <article class="ch-body">
      <div class="chips" id="pqf">${['すべて','第1部','第2部'].map((t,i)=>`<button class="${PQ.filter===i?'on':''}" data-f="${i}">${t}</button>`).join('')}</div>
      <div class="pq-map" id="pqmap">${list.map((x,i)=>`<button class="${res[x.id]||''} ${i===PQ.i?'cur':''}" data-i="${i}" aria-label="問題${i+1}">${pad2(i+1)}</button>`).join('')}</div>
      <p class="pg-count">QUESTION ${pad2(PQ.i+1)} / ${pad2(list.length)}</p>
      <p class="pq-kind">${kind}</p>
      <h2 class="pq-q">${q.q}</h2>
      <div class="pg-content" id="pqc">
        ${q.ctx?`<pre class="term" data-t="この順に実行した">${esc(q.ctx)}</pre>`:''}
        ${q.type==='input'
          ?`<form class="pq-form" id="pqform"><label class="pq-input"><span>$</span><input id="pqin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここにコマンドを入力" aria-label="コマンド"></label><button class="btn" type="submit">答え合わせ <span class="arr">→</span></button></form>`
          :`<div class="pq-choices">${q.choices.map((c,i)=>`<button data-c="${i}"><span>${'ABCD'[i]}</span><span>${isCmd(c)?`<code>${esc(c)}</code>`:esc(c)}</span></button>`).join('')}</div>`}
        <div id="pqfb"></div>
      </div>
      <nav class="pager">
        ${PQ.i>0?`<button data-nav="-1"><small>← PREV</small><b>前の問題</b></button>`:'<span></span>'}
        ${PQ.i<list.length-1?`<button class="next" data-nav="1"><small>NEXT →</small><b>次の問題</b></button>`:`<a class="next" href="#/errors"><small>NEXT →</small><b>エラー解決集へ</b></a>`}
      </nav>
    </article>
  </div>`;
  const content=$('#pqc'); enhanceTerms(content);
  if(A()) anime({targets:['.pq-kind','.pq-q',...content.children],opacity:[0,1],translateY:[10,0],delay:anime.stagger(50),duration:420,easing:'easeOutQuad'});

  const mark=(ok)=>{
    if(ok) res[q.id]='ok'; else if(res[q.id]!=='ok') res[q.id]='ng';
    save();
    const b=$(`#pqmap [data-i="${PQ.i}"]`); b.classList.remove('ok','ng'); b.classList.add(res[q.id]);
    $('#pqs').textContent=solved();
  };
  const fb=(cls,head,body)=>{
    const f=$('#pqfb'); f.innerHTML=`<div class="pq-fb ${cls}"><p class="pq-fbh">${head}</p>${body}</div>`;
    if(A()) anime({targets:f.firstChild,opacity:[0,1],translateY:[8,0],duration:350,easing:'easeOutQuad'});
  };
  if(q.type==='input'){
    const inp=$('#pqin');
    if(matchMedia('(min-width:900px)').matches) inp.focus();
    $('#pqform').onsubmit=e=>{
      e.preventDefault();
      const v=inp.value.replace(/[　\s]+/g,' ').replace(/[“”＂]/g,'"').replace(/[‘’＇]/g,"'").replace(/^\$\s*/,'').trim();
      if(!v) return;
      if(q.ans.some(r=>r.test(v))){ mark(true); fb('ok','○ 正解',`<p>${q.exp}</p>`); return; }
      PQ.wrong++; mark(false);
      const alt=(q.alt||[]).find(([r])=>r.test(v));
      const msg=alt?alt[1]:PQ.wrong===1?`ヒント：${q.hint}`:'もう一度考えてみましょう。';
      fb('ng','× ちがいます',`<p>${esc(msg)}</p><button class="btn ghost" type="button" id="pqshow">答えを見る</button>${refLink(q.ref)}`);
      $('#pqshow').onclick=()=>fb('ans','答え',`<p><code>${esc(q.a)}</code></p><p>${q.exp}</p><p style="font-size:13px;color:var(--sub)">入力欄に打ち込んで、正解にしてから次へ進みましょう。</p>${refLink(q.ref)}`);
    };
  }else{
    $$('.pq-choices button').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.c, ok=i===q.correct;
      $$('.pq-choices button').forEach((x,k)=>{ x.disabled=true; if(k===q.correct) x.classList.add('ok'); else if(k===i) x.classList.add('ng'); else x.classList.add('dim'); });
      mark(ok);
      fb(ok?'ok':'ng',ok?'○ 正解':`× 正解は ${'ABCD'[q.correct]}`,`<p>${q.exp}</p>${ok?'':refLink(q.ref)}`);
    });
  }
  $('#pqf').onclick=e=>{ const b=e.target.closest('[data-f]'); if(!b) return; PQ.filter=+b.dataset.f; PQ.i=0; renderPractice(); };
  $('#pqmap').onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; PQ.i=+b.dataset.i; renderPractice(); };
  $$('.pager [data-nav]').forEach(b=>b.onclick=()=>{ PQ.i+= +b.dataset.nav; renderPractice(); window.scrollTo({top:0,behavior:'instant'}); });
}

      <p class="ch-part">EXTRA</p><p class="ch-no">!</p><h1 class="ch-title">エラー解決集</h1>
      <p class="pq-help">エラーが出ても、何かが壊れたわけではありません。Git は多くの場合、<b>危ないことをする前に止めてくれています</b>。</p>
    </aside>
    <article class="ch-body">
      <p class="pg-count">TROUBLESHOOTING — ${ERRORS.length} ERRORS</p>
      <h2 class="pg-title">エラーが出たら</h2>
      <ol class="flow">
        <li><div><b>最初の行を読む</b><small><code>fatal:</code> や <code>error:</code> の後ろが原因、<code>hint:</code> の後ろが対処のヒントです</small></div></li>
        <li><div><b>git status で今の状態を確かめる</b><small>どのブランチにいて、どのファイルがどこにあるか</small></div></li>
        <li><div><b>下の一覧で探す</b><small>英語のメッセージの一部を、そのまま検索欄に貼り付けられます</small></div></li>
      </ol>
      <label class="esearch" style="margin-top:32px"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="#1a1a1a" stroke-width="2"/><path d="M12 12l5 5" stroke="#1a1a1a" stroke-width="2"/></svg><input id="eq" placeholder="例：rejected / Permission denied / CONFLICT" aria-label="エラーを検索"></label>
      <div class="chips" id="ecat">${ECATS.map(([k,t])=>`<button class="${EQ.cat===k?'on':''}" data-c="${k}">${t}</button>`).join('')}</div>
      <div class="elist" id="elist"></div>
    </article>
  </div>`;
  const inp=$('#eq'); inp.value=EQ.q;
  const catName=k=>ECATS.find(c=>c[0]===k)[1];
  function draw(){
    const q=EQ.q.trim().toLowerCase();
    const hit=ERRORS.filter(e=>(EQ.cat==='all'||e.cat===EQ.cat)&&(!q||(e.m+' '+e.t+' '+e.mean).toLowerCase().includes(q)));
    const L=$('#elist');
    L.innerHTML=hit.length?hit.map(e=>`
      <details class="err"${hit.length===1?' open':''}>
        <summary><span class="err-cat">${catName(e.cat)}</span><span class="err-t">${e.t}</span><code class="err-m1">${esc(e.m.split('\n')[0])}</code></summary>
        <div class="err-b">
          <div class="err-msg">${esc(e.m)}</div>
          <dl class="spec"><dt>意味</dt><dd>${e.mean}</dd><dt>よくある原因</dt><dd>${e.cause}</dd></dl>
          <h4 class="err-h">直し方</h4>
          <div class="err-fix">${e.fix}</div>
          ${e.ref?`<p class="pq-ref"><a href="#/${e.ref}">→ 第${e.ref.slice(2,4)}章で詳しく見る</a></p>`:''}
        </div>
      </details>`).join(''):'<p class="enone">見つかりませんでした。メッセージの別の部分（英単語1〜2語）で探してみましょう。</p>';
    enhanceTerms(L);
  }
  inp.oninput=()=>{ EQ.q=inp.value; draw(); };
  $('#ecat').onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; EQ.cat=b.dataset.c; $$('#ecat button').forEach(x=>x.classList.toggle('on',x===b)); draw(); };
  draw();
  if(A()) anime({targets:'.err',opacity:[0,1],translateY:[8,0],delay:anime.stagger(25),duration:350,easing:'easeOutQuad'});
}

  const title=c?`${c.no} ${c.title}`:id==='practice'?'コマンド練習':'エラー解決集';

/* =========================================================
   GIT SIMULATOR
   4つの場所（ワークツリー / ステージ / ローカル / リモート）の状態を
   ふつうのオブジェクトで持ち、操作ごとに描き直す。
   ========================================================= */
function Simulator(el){
  const FILES=['index.html','style.css','about.html'];
  const REMOTE='github.com:you/you.github.io.git';
  let s, firstPushDone, pushedAfterEdit;
  const hex=()=>Math.random().toString(16).slice(2,9).padEnd(7,'0');
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

  function reset(){
    s={wt:{},idx:{},head:{},commits:[],remote:[],term:[],note:'まずは「ファイルを作る」を押してみましょう。'};
    firstPushDone=false; pushedAfterEdit=false; s.edited=false;
  }
  reset();

  // 状態の分類
  const untracked=()=>Object.keys(s.wt).filter(f=>!(f in s.idx));
  const modified=()=>Object.keys(s.wt).filter(f=>f in s.idx && s.wt[f]!==s.idx[f]);
  const staged=()=>Object.keys(s.idx).filter(f=>s.idx[f]!==s.head[f]);
  const headTreeSame=()=>same(s.idx,s.head);

  function out(cmd,lines){ s.term.push('$ '+cmd); (lines||[]).forEach(l=>s.term.push(l)); s.term=s.term.slice(-80); }

  function statusLines(){
    const L=['On branch main'];
    if(s.remote.length){
      const ahead=s.commits.length-s.remote.length;
      L.push(ahead>0?`Your branch is ahead of 'origin/main' by ${ahead} commit${ahead>1?'s':''}.`:"Your branch is up to date with 'origin/main'.");
    }
    if(!s.commits.length){ L.push('','No commits yet'); }
    const st=staged(), mo=modified(), un=untracked();
    if(st.length){ L.push('','Changes to be committed:'); st.forEach(f=>L.push(`\t${f in s.head?'modified:':'new file:'}   ${f}`)); }
    if(mo.length){ L.push('','Changes not staged for commit:'); mo.forEach(f=>L.push(`\tmodified:   ${f}`)); }
    if(un.length){ L.push('','Untracked files:'); un.forEach(f=>L.push(`\t${f}`)); }
    if(!st.length&&!mo.length&&!un.length) L.push('',s.commits.length?'nothing to commit, working tree clean':'nothing to commit (create/copy files and use "git add" to track)');
    else if(!st.length) L.push('',un.length&&!mo.length?'nothing added to commit but untracked files present (use "git add" to track)':'no changes added to commit (use "git add" and/or "git commit -a")');
    return L;
  }

  // ---- 操作 ----
  const ops={
    create(){
      const f=FILES.find(x=>!(x in s.wt)); if(!f) return;
      s.wt[f]=1; s.note=`ワークツリーに ${f} ができました。まだ Git は記録していません（Untracked）。`;
      return [];
    },
    edit(f){
      s.wt[f]++; if(s.remote.length) s.edited=true;
      s.note=`${f} を編集しました。ワークツリーの中身だけが変わり、ステージや記録はそのままです。`;
      return [];
    },
    add(f){
      const targets=f?[f]:[...untracked(),...modified()];
      out(f?`git add ${f}`:'git add .');
      if(!targets.length){ s.note='ステージに乗せる変更がありません（add は成功しても何も表示しません）。'; return []; }
      targets.forEach(x=>s.idx[x]=s.wt[x]);
      s.note=`${targets.join(', ')} をステージに乗せました。次の commit に入ります。`;
      return targets.map(x=>['wt:'+x,'ix:'+x,x]);
    },
    commit(msg){
      msg=(msg||'').trim();
      if(!msg){ s.note='コミットメッセージを入力してください。'; return []; }
      out(`git commit -m "${msg}"`);
      if(headTreeSame()){
        s.term.push(...statusLines().filter(l=>!/^(On branch|Your branch)/.test(l)||true));
        s.note='ステージに何も乗っていないので、記録するものがありません。先に add しましょう。';
        return [];
      }
      const st=staged(), id=hex(), root=!s.commits.length;
      s.commits.push({id,msg,tree:{...s.idx}}); s.head={...s.idx};
      s.term.push(`[main${root?' (root-commit)':''} ${id}] ${msg}`, ` ${st.length} file${st.length>1?'s':''} changed`);
      s.note=`ステージの内容を「${msg}」として記録しました。ステージに並べた変更が記録に入り、ローカルリポジトリにコミットが1つ増えました。`;
      $('.sim-commit input',el).value='';
      return st.map(x=>['ix:'+x,'lc:'+id,x]);
    },
    push(){
      out('git push');
      if(!s.commits.length){
        s.term.push('error: src refspec main does not match any',`error: failed to push some refs to '${REMOTE}'`);
        s.note='まだコミットが1つもないので、送るものがありません。先に commit しましょう。';
        return [];
      }
      const newOnes=s.commits.slice(s.remote.length);
      if(!newOnes.length){ s.term.push('Everything up-to-date'); s.note='GitHub はすでに最新です。編集 → add → commit してから push しましょう。'; return []; }
      const from=s.remote.length?s.remote[s.remote.length-1].id:null;
      s.term.push(`To ${REMOTE}`, from?`   ${from}..${newOnes[newOnes.length-1].id}  main -> main`:' * [new branch]      main -> main');
      s.remote=s.commits.map(c=>({...c}));
      if(firstPushDone && s.edited) pushedAfterEdit=true;
      firstPushDone=true;
      s.note=`${newOnes.length} 個のコミットを GitHub に送りました。ワークツリーやステージは変わりません。`;
      return newOnes.map(c=>['lc:'+c.id,'rc:'+c.id,c.id]);
    },
    status(){ out('git status',statusLines()); s.note='status は状態を表示するだけで、何も動かしません。迷ったらまず status。'; return []; }
  };

  // ---- 描画 ----
  function render(){
    const un=untracked(), mo=modified(), st=staged();
    const wtCards=Object.keys(s.wt).map(f=>{
      const tag=un.includes(f)?'<span class="tag u">U 未追跡</span>':mo.includes(f)?'<span class="tag m">M 変更</span>':'<span class="tag c">変更なし</span>';
      const canAdd=un.includes(f)||mo.includes(f);
      return `<div class="fcard" data-key="wt:${f}"><div class="fn">${f}${tag}</div><div class="ver">v${s.wt[f]}</div>
        <div class="acts"><button data-op="edit" data-f="${f}">編集</button><button data-op="add" data-f="${f}" ${canAdd?'':'disabled'}>add</button></div></div>`;
    }).join('');
    const ixCards=st.map(f=>`<div class="fcard" data-key="ix:${f}"><div class="fn">${f}<span class="tag ${f in s.head?'m':'u'}">${f in s.head?'変更':'新規'}</span></div><div class="ver">v${s.idx[f]}</div></div>`).join('');
    const commits=(arr,pre,ref)=>arr.slice().reverse().map((c,i)=>`<div class="ccard" data-key="${pre}:${c.id}"><span class="id">${c.id}</span>${i===0?`<span class="ref">${ref}</span>`:''}<span class="msg">${esc(c.msg)}</span></div>`).join('');
    const empty=t=>`<p class="sim-empty">${t}</p>`;
    $('.sim-grid',el).innerHTML=`
      <div class="sim-col"><h5><span>01</span><div>ワークツリー<small>編集中のファイル</small></div></h5>${wtCards||empty('ファイルなし')}</div>
      <div class="sim-col"><h5><span>02</span><div>ステージ<small>次の記録に入るもの</small></div></h5>${ixCards||empty('空')}</div>
      <div class="sim-col"><h5><span>03</span><div>ローカル<small>あなたの PC の記録</small></div></h5>${commits(s.commits,'lc','main')||empty('コミットなし')}</div>
      <div class="sim-col"><h5><span>04</span><div>リモート<small>GitHub 上の記録</small></div></h5>${commits(s.remote,'rc','origin/main')||empty('まだ何もない')}</div>`;
    $('.sim-note',el).textContent=s.note;
    const tb=$('.term-b',el);
    tb.innerHTML=s.term.length?termHTML(s.term):'<span class="ln out">ここに git の出力が表示されます</span>';
    tb.scrollTop=tb.scrollHeight;
    $('[data-op=create]',el).disabled=FILES.every(f=>f in s.wt);
    missions();
  }
  function missions(){
    const m=$('#mission'); if(!m) return;
    const ok={
      1:Object.keys(s.wt).length>=2,
      2:s.commits.some(c=>Object.keys(c.tree).length===1&&'index.html' in c.tree),
      3:s.commits.length>=2&&Object.keys(s.wt).every(f=>f in s.head),
      4:s.remote.length>0,
      5:pushedAfterEdit
    };
    $$('li',m).forEach(li=>li.classList.toggle('ok',!!ok[li.dataset.m]));
  }

  // ---- 移動アニメーション ----
  function run(op,arg){
    const before={};
    $$('[data-key]',el).forEach(n=>before[n.dataset.key]=n.getBoundingClientRect());
    const moves=ops[op](arg)||[];
    render();
    if(!A()) return;
    moves.forEach(([from,to,label],i)=>{
      const r1=before[from], target=$(`[data-key="${CSS.escape(to)}"]`,el);
      if(!r1||!target) return;
      const r2=target.getBoundingClientRect();
      const chip=document.createElement('div'); chip.className='fly'; chip.textContent=label;
      Object.assign(chip.style,{left:r1.left+'px',top:r1.top+'px',width:Math.min(r1.width,180)+'px'});
      document.body.appendChild(chip); target.style.opacity=0;
      anime({targets:chip,left:r2.left,top:r2.top,width:r2.width,duration:650,delay:i*90,easing:'easeInOutQuart',
        complete(){ chip.remove(); target.style.opacity=1; anime({targets:target,backgroundColor:['#f2e1dc','#fbfaf7'],duration:600,easing:'linear'}); }});
    });
    const newCards=$$('.sim-col:first-child .fcard',el).filter(n=>!before[n.dataset.key]);
    if(newCards.length) anime({targets:newCards,opacity:[0,1],translateY:[-8,0],duration:400,easing:'easeOutQuad'});
  }

  el.className='sim';
  el.innerHTML=`
    <div class="sim-bar">
      <button class="jp" data-op="create">＋ ファイルを作る</button>
      <button data-op="add">git add .</button>
      <span class="sim-commit"><input type="text" placeholder="コミットメッセージ" maxlength="40" aria-label="コミットメッセージ"><button data-op="commit">git commit</button></span>
      <button data-op="push">git push</button>
      <button data-op="status">git status</button>
      <button class="reset" data-op="reset">リセット</button>
    </div>
    <div class="sim-grid"></div>
    <div class="sim-note"></div>
    <div class="term"><div class="term-h"><span>SIMULATED TERMINAL</span></div><div class="term-b"></div></div>`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('button[data-op]'); if(!b||b.disabled) return;
    const op=b.dataset.op;
    if(op==='reset'){ reset(); render(); return; }
    if(op==='commit') return run('commit',$('.sim-commit input',el).value);
    run(op,b.dataset.f);
  });
  $('.sim-commit input',el).addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) run('commit',e.target.value); });
  render();
}

/* =========================================================
   BOOT
   ========================================================= */
const totop=$('#totop');
window.addEventListener('scroll',()=>totop.classList.toggle('on',scrollY>600),{passive:true});
totop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
route();
</script>
