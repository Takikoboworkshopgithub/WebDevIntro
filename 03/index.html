<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git &amp; GitHub Lesson</title>
<meta name="description" content="Git と GitHub を、手を動かしながら学ぶ入門教材。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --paper:#f4f2ec;
  --white:#fbfaf7;
  --ink:#1a1a1a;
  --sub:#55534d;
  --mute:#8f8b82;
  --line:#d6d2c7;
  --line2:#e6e3db;
  --accent:#c8321f;
  --accent-weak:#f2e1dc;
  --code:#1c1c1a;
  --code-text:#ecebe5;
  --code-mute:#8d8a82;
  --code-add:#9fd19a;
  --code-del:#f0907f;
  --ok:#2e6b4b;
  --latin:"Inter","Noto Sans JP",system-ui,sans-serif;
  --jp:"Noto Sans JP","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --max:1160px;
  --gut:clamp(16px,4vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
a{color:inherit}
b,strong{font-weight:700}
code{font-family:var(--mono);font-size:.9em;background:var(--line2);padding:.08em .38em;border-radius:2px;letter-spacing:0;word-break:break-all}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.latin{font-family:var(--latin)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* =========================================================
   HEADER
   ========================================================= */
.site-head{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--ink)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.2;font-family:var(--latin)}
.brand-t b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand-t small{font-size:11px;color:var(--sub);letter-spacing:.08em}
.gnav{display:flex;gap:4px}
.gnav a{font-size:14px;font-weight:500;text-decoration:none;padding:8px 12px;position:relative}
.gnav a::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.gnav a:hover::after,.gnav a.on::after{transform:scaleX(1)}
.progress-line{height:3px;background:transparent}
.progress-line span{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
@media (max-width:640px){
  .head-in{height:auto;flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
  .gnav{justify-content:space-between;margin:4px -8px 0}
  .gnav a{font-size:13px;padding:8px}
}

/* =========================================================
   COMMON PARTS
   ========================================================= */
.kicker{font-family:var(--latin);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:15px;padding:14px 22px;border:0;cursor:pointer;font-family:var(--jp);letter-spacing:.04em;transition:background .2s}
.btn:hover{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn .arr{font-family:var(--latin)}
.rule{border:0;border-top:1px solid var(--ink)}

/* =========================================================
   HOME
   ========================================================= */
.hero{padding:56px 0 48px;display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:end;border-bottom:1px solid var(--ink)}
.hero h1{font-family:var(--latin);font-weight:800;font-size:clamp(56px,10vw,128px);line-height:.92;letter-spacing:-.045em;margin:20px 0 28px}
.hero h1 .amp{color:var(--accent)}
.hero-lead{font-size:17px;max-width:30em;color:var(--sub)}
.hero-lead b{color:var(--ink)}
.hero-cta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
.hero-fig svg{width:100%;height:auto;display:block}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:36px}.hero-fig{order:-1;max-width:420px}}

.sec{padding:56px 0;border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:200px 1fr;gap:24px;margin-bottom:32px;align-items:baseline}
.sec-head h2{font-size:24px;font-weight:700;letter-spacing:.04em}
@media (max-width:720px){.sec-head{grid-template-columns:1fr;gap:4px}}

.goals{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink)}
.goal{padding:28px 28px 32px 0;border-right:1px solid var(--line)}
.goal+.goal{padding-left:28px;border-right:0}
.goal .no{font-family:var(--latin);font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.goal h3{font-size:20px;margin:16px 0 8px}
.goal p{color:var(--sub);font-size:15px}
@media (max-width:720px){.goals{grid-template-columns:1fr}.goal,.goal+.goal{padding:24px 0;border-right:0}.goal+.goal{border-top:1px solid var(--line)}}

.prog{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.prog-num{font-family:var(--latin);font-weight:800;font-size:clamp(72px,12vw,120px);line-height:.9;letter-spacing:-.05em}
.prog-num small{font-size:.35em;letter-spacing:0;margin-left:4px}
.prog-cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.prog-cells span{height:28px;background:var(--line2);position:relative}
.prog-cells span.done{background:var(--ink)}
.prog-cells span.p2{background:transparent;border:1px solid var(--line)}
.prog-cells span.p2.done{background:var(--ink);border-color:var(--ink)}
.prog-legend{display:flex;justify-content:space-between;font-family:var(--latin);font-size:11px;color:var(--mute);margin-top:8px;letter-spacing:.1em}
@media (max-width:720px){.prog{grid-template-columns:1fr;gap:16px}}

.toc{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.toc-part h3{font-family:var(--latin);font-size:12px;letter-spacing:.2em;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.toc-part h3 span:last-child{color:var(--mute)}
.toc-part p.desc{font-size:14px;color:var(--sub);margin:12px 0 4px}
.toc-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .2s,background .2s}
a.toc-row:hover{padding-left:8px;background:var(--white)}
.toc-row .n{font-family:var(--latin);font-weight:800;font-size:22px;letter-spacing:-.03em}
.toc-row .t b{display:block;font-size:16px}
.toc-row .t small{display:block;font-size:13px;color:var(--sub);line-height:1.6}
.toc-row .st{font-family:var(--latin);font-size:11px;letter-spacing:.12em;color:var(--mute);display:flex;align-items:center;gap:8px}
.toc-row .st i{width:12px;height:12px;border:1px solid var(--ink);display:inline-block}
.toc-row.done .st{color:var(--ink)}
.toc-row.done .st i{background:var(--ink)}
.toc-row.soon{color:var(--mute)}
.toc-row.soon .n{color:var(--line)}
@media (max-width:820px){.toc{grid-template-columns:1fr;gap:40px}}

.foot{padding:40px 0 56px;font-family:var(--latin);font-size:12px;color:var(--mute);letter-spacing:.1em}

/* =========================================================
   CHAPTER
   ========================================================= */
.chapter{display:grid;grid-template-columns:260px 1fr;gap:56px;padding-top:40px;padding-bottom:80px}
.ch-side{position:sticky;top:96px;align-self:start}
.ch-part{font-family:var(--latin);font-size:11px;letter-spacing:.18em;color:var(--sub);font-weight:600}
.ch-no{font-family:var(--latin);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.06em;margin:8px 0 4px}
.ch-title{font-size:22px;line-height:1.5;margin-bottom:24px}
.ch-pages{list-style:none;border-top:1px solid var(--ink)}
.ch-pages a{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;line-height:1.5;color:var(--sub)}
.ch-pages a span{font-family:var(--latin);font-size:12px;font-weight:600;padding-top:1px}
.ch-pages a.cur{color:var(--ink);font-weight:700}
.ch-pages a.cur span{color:var(--accent)}
.ch-pages a:hover{color:var(--ink)}
.ch-body{min-width:0;max-width:760px}
.pg-count{font-family:var(--latin);font-size:12px;letter-spacing:.16em;color:var(--sub);display:flex;align-items:center;gap:12px}
.pg-count::before{content:"";width:24px;height:2px;background:var(--accent)}
.pg-title{font-size:clamp(26px,4vw,36px);line-height:1.4;margin:14px 0 28px;letter-spacing:.02em}
.pg-steps{display:none}
@media (max-width:900px){
  .chapter{grid-template-columns:1fr;gap:0;padding-top:24px}
  .ch-side{position:static;display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:24px}
  .ch-no{font-size:64px;margin:0;grid-row:1/3}
  .ch-part{align-self:end}
  .ch-title{font-size:18px;margin:0}
  .ch-pages{display:none}
  .pg-steps{display:flex;gap:4px;margin-bottom:20px}
  .pg-steps a{flex:1;height:4px;background:var(--line)}
  .pg-steps a.cur{background:var(--accent)}
  .pg-steps a.past{background:var(--ink)}
}

/* ---------- content blocks ---------- */
.pg-content>*+*{margin-top:24px}
.pg-content p{max-width:40em}
.lead{font-size:18px;line-height:1.9;font-weight:500}
.h{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:10px;padding-top:16px}
.h::before{content:"";width:10px;height:10px;background:var(--ink);flex:none;transform:translateY(-1px)}
.h.ac::before{background:var(--accent)}
.em{background:linear-gradient(transparent 62%,var(--accent-weak) 62%);font-weight:700}
.ph{color:var(--accent);font-weight:600}

.box{border:1px solid var(--ink);padding:18px 20px 18px;position:relative;background:var(--white)}
.box::before{content:attr(data-k);position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.14em;padding:3px 10px;font-family:var(--latin)}
.box>:first-child{margin-top:16px}
.box>*+*{margin-top:8px}
.box.warn{border-color:var(--accent)}
.box.warn::before{background:var(--accent)}
.box.plain{border-color:var(--line);background:transparent}
.box.plain::before{background:var(--line);color:var(--ink)}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.box dt{font-weight:700}

.spec{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--ink)}
.spec dt,.spec dd{padding:12px 0;border-bottom:1px solid var(--line)}
.spec dt{font-size:12px;font-family:var(--latin);letter-spacing:.12em;font-weight:600;color:var(--sub);padding-top:15px}
.spec dd{font-size:15px}
@media (max-width:560px){.spec{grid-template-columns:1fr}.spec dt{border-bottom:0;padding-bottom:0}}

.flow{list-style:none;counter-reset:f;border-top:1px solid var(--ink)}
.flow li{counter-increment:f;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.flow li::before{content:counter(f,decimal-leading-zero);font-family:var(--latin);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.5}
.flow li b{display:block}
.flow li small{display:block;color:var(--sub);font-size:14px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>div{border-top:2px solid var(--ink);padding-top:12px}
.cols h4{font-size:16px;margin-bottom:6px}
.cols p{font-size:15px;color:var(--sub)}
@media (max-width:620px){.cols{grid-template-columns:1fr}}

.nums{display:grid;gap:0;border-top:1px solid var(--ink)}
.nums>div>div{min-width:0}
.nums>div{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
.nums .n{font-family:var(--latin);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.04em;color:var(--accent)}
.nums h4{font-size:17px;margin-bottom:4px}
.nums p{font-size:15px;color:var(--sub)}
.nums .term{margin-top:12px}

.ba{display:grid;grid-template-columns:1fr 32px 1fr;align-items:stretch}
.ba>.side{border:1px solid var(--line);background:var(--white);padding:14px 16px}
.ba>.side.after{border-color:var(--ink)}
.ba .lbl{font-family:var(--latin);font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--mute);margin-bottom:8px}
.ba .after .lbl{color:var(--accent)}
.ba .arrow{display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:18px}
.tree{font-family:var(--mono);font-size:13.5px;line-height:1.75;white-space:pre;letter-spacing:0}
.tree .new{color:var(--accent);font-weight:600}
@media (max-width:620px){.ba{grid-template-columns:1fr}.ba .arrow{transform:rotate(90deg);height:32px}}

.mis{border-top:1px solid var(--ink)}
.mis>div{padding:14px 0;border-bottom:1px solid var(--line)}
.mis .q{font-weight:700;display:grid;grid-template-columns:24px 1fr}
.mis .q::before{content:"×";color:var(--accent);font-family:var(--latin);font-weight:800}
.mis .a{display:grid;grid-template-columns:24px 1fr;color:var(--sub);font-size:15px;margin-top:4px}
.mis .a::before{content:"→";font-family:var(--latin)}
.mis .a>div>*+*{margin-top:8px}
.mis-h{font-family:var(--latin);font-size:12px;letter-spacing:.18em;font-weight:600;color:var(--accent);margin-bottom:6px}

.ui-path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px}
.ui-path span{border:1px solid var(--ink);padding:2px 10px;background:var(--white);font-family:var(--latin);font-weight:500}
.ui-path span+span::before{content:"›";margin:0 10px 0 -18px;font-weight:700;color:var(--accent)}
.ui-path span+span{margin-left:14px}

.legend{border-top:1px solid var(--ink)}
.legend>div{display:grid;grid-template-columns:88px 1fr;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.legend .sym{font-family:var(--latin);font-weight:800;font-size:18px}

/* ---------- terminal ---------- */
.term{background:var(--code);color:var(--code-text);font-family:var(--mono);font-size:14px;line-height:1.75;letter-spacing:0;overflow:hidden}
.term-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #34332f;font-size:11px;letter-spacing:.12em;color:var(--code-mute);font-family:var(--latin)}
.term-h button{background:none;border:1px solid #4a4944;color:var(--code-text);font:600 11px var(--latin);letter-spacing:.12em;padding:3px 10px;cursor:pointer}
.term-h button:hover{background:var(--code-text);color:var(--code)}
.term-b{padding:14px 16px;overflow-x:auto;white-space:pre}
.term-b .ln{display:block;min-height:1.75em}
.term-b .pr{color:var(--accent);font-weight:600;user-select:none}
.term-b .cmd{color:#fff;font-weight:600}
.term-b .out{color:var(--code-mute)}
.term-b .cm{color:#6d6b64;font-weight:400}
.term-b .an{color:#e8c37a;font-family:var(--jp);font-weight:500}
.term-b .add{color:var(--code-add)}
.term-b .del{color:var(--code-del)}
.term-b .hunk{color:#86a8d6}
.term-b .ph{color:#ffb4a6}
pre.term:not(.ready){padding:14px 16px;white-space:pre}

/* ---------- diagrams ---------- */
.fig{border:1px solid var(--line);background:var(--white);padding:24px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .cap{font-size:13px;color:var(--sub);margin-top:12px;font-family:var(--jp)}
.route{display:grid;grid-template-columns:1fr 64px 1fr 64px 1fr;align-items:center}
.route .node{border:1px solid var(--ink);padding:14px 12px;background:var(--white);text-align:center}
.route .node span{display:block;font-size:12px;color:var(--sub)}
.route .node b{display:block;font-family:var(--latin);font-size:15px;word-break:break-all}
.route .node.ac{background:var(--ink);color:var(--paper)}
.route .node.ac span{color:#bdb9b0}
.route .edge{text-align:center;font-family:var(--latin);font-weight:700;font-size:12px;position:relative;height:40px}
.route .edge i{position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--accent);transform-origin:left}
.route .edge i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--accent);border-right:0}
.route .edge em{position:absolute;left:0;right:0;top:-2px;font-style:normal;letter-spacing:.06em}
@media (max-width:620px){
  .route{grid-template-columns:1fr}
  .route .edge{height:44px}
  .route .edge i{left:50%;right:auto;top:6px;bottom:6px;width:2px;height:auto;transform-origin:top}
  .route .edge i::after{right:auto;top:auto;bottom:-1px;left:-4px;border:5px solid transparent;border-top:8px solid var(--accent);border-bottom:0}
  .route .edge em{top:11px;left:50%;right:auto;padding-left:14px;text-align:left}
}

.areas{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr;align-items:stretch}
.area{border:1px solid var(--ink);background:var(--white);padding:14px 12px 16px;transition:background .3s,color .3s}
.area .an{font-family:var(--latin);font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}
.area h4{font-size:15px;margin:10px 0 4px;line-height:1.4}
.area p{font-size:12.5px;color:var(--sub);line-height:1.6}
.area.remote{border-style:dashed}
.area.lit{background:var(--ink);color:var(--paper)}
.area.lit p{color:#c9c5bb}
.aarrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--mono);font-size:11px;font-weight:600}
.aarrow i{font-style:normal;font-family:var(--latin);font-size:18px;color:var(--accent);transition:transform .3s}
.aarrow.lit i{transform:translateX(4px)}
.area-zones{display:grid;grid-template-columns:3fr 1fr;gap:40px;margin-top:8px;font-family:var(--latin);font-size:11px;letter-spacing:.14em;color:var(--sub)}
.area-zones span{border-top:1px solid var(--ink);padding-top:4px}
@media (max-width:760px){
  .areas{grid-template-columns:1fr}
  .aarrow{flex-direction:row;height:40px;gap:8px}
  .aarrow i{transform:rotate(90deg)}
  .aarrow.lit i{transform:rotate(90deg) translateX(4px)}
  .area-zones{display:none}
  .area h4{margin-top:6px}
}

.keys{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center}
.keys .place{border:1px solid var(--ink);background:var(--white);padding:16px}
.keys .place h4{font-family:var(--latin);font-size:12px;letter-spacing:.16em;color:var(--sub);margin-bottom:10px}
.kchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 10px;font-size:14px;background:var(--paper)}
.kchip+.kchip{margin-top:8px}
.kchip code{background:none;padding:0;font-weight:600}
.kchip small{display:block;font-size:12px;color:var(--sub);line-height:1.4}
.kchip.sec{border-color:var(--accent)}
.kchip svg{flex:none}
.keys .mid{text-align:center;font-family:var(--latin);font-size:11px;font-weight:700;letter-spacing:.1em}
.keys .mid i{display:block;font-style:normal;font-size:22px;color:var(--accent)}
@media (max-width:620px){.keys{grid-template-columns:1fr}.keys .mid{padding:8px 0}.keys .mid i{transform:rotate(90deg)}}

.loop{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink)}
.loop>div{padding:16px 14px;border-right:1px solid var(--line);position:relative;background:var(--white)}
.loop>div:last-child{border-right:0}
.loop .n{font-family:var(--latin);font-weight:800;font-size:12px;color:var(--accent);letter-spacing:.1em}
.loop b{display:block;font-family:var(--mono);font-size:14px;margin:4px 0}
.loop small{display:block;font-size:12.5px;color:var(--sub);line-height:1.6}
.loop-back{font-family:var(--latin);font-size:12px;color:var(--sub);text-align:right;padding-top:6px;letter-spacing:.06em}
@media (max-width:620px){.loop{grid-template-columns:1fr 1fr}.loop>div:nth-child(2){border-right:0}.loop>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- state transition (stx) ---------- */
.stx{border:1px solid var(--line);background:var(--white);padding:16px}
.stl{font-family:var(--latin);font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--mute);margin-bottom:6px}
.stl.ac{color:var(--accent)}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scell{border:1px solid var(--line);padding:8px;min-height:64px;background:var(--paper);min-width:0}
.scell.rc{border-style:dashed}
.srow.after .scell.chg{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-2px;background:var(--white)}
.sl{font-size:11px;color:var(--sub);line-height:1.3;margin-bottom:4px}
.sl b{font-family:var(--latin);font-weight:800;margin-right:4px;color:var(--ink)}
.schip{display:block;font:600 11.5px/1.5 var(--mono);border:1px solid var(--ink);background:var(--white);padding:2px 6px;margin-top:4px;overflow-wrap:anywhere;letter-spacing:0}
.schip i{font-style:normal;font-family:var(--jp);font-size:10px;font-weight:700;margin-left:6px}
.schip.u{border-color:var(--accent)}.schip.u i{color:var(--accent)}
.schip.m{border-color:#b0700f}.schip.m i{color:#b0700f}
.schip.n i,.schip.s i{color:var(--accent)}
.schip.k{border-color:var(--line);color:var(--sub)}
.schip.c{border:0;border-left:3px solid var(--ink);font-family:var(--jp);font-weight:500}
.schip.c code{background:none;padding:0;color:var(--accent);font-weight:600}
.snone{font-size:12px;color:var(--mute)}
.scmd{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.scmd span{color:var(--accent);font:800 18px var(--latin)}
.scmd code{background:var(--ink);color:var(--paper);padding:4px 10px;font-size:13px}
.stx-cap{font-size:13px;color:var(--sub);margin-top:10px}
@media (max-width:620px){.srow{grid-template-columns:1fr 1fr}}

/* ---------- status map ---------- */
.smap{display:grid;grid-template-columns:1.3fr 56px 1fr;align-items:stretch}
.smap .scell{background:var(--white);border-color:var(--ink);padding:12px}
.smap .scell.chg{border-color:var(--accent)}
.sitem{border-top:1px solid var(--line);padding:8px 0 4px}
.sitem code{background:none;padding:0;font-weight:600;font-size:13px}
.sitem small{display:block;font-size:12.5px;color:var(--sub);line-height:1.6}
.smap-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 12px var(--mono)}
.smap-arrow i{font-style:normal;font:800 20px var(--latin);color:var(--accent)}
@media (max-width:620px){.smap{grid-template-columns:1fr}.smap-arrow{flex-direction:row;gap:8px;height:40px}.smap-arrow i{transform:rotate(90deg)}}

/* ---------- windows / wsl ---------- */
.fs{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center}
.fs-side{border:1px solid var(--ink);background:var(--white);padding:14px 16px}
.fs-side.ac{background:var(--ink);color:var(--paper)}
.fs-side h4{font:600 11px var(--latin);letter-spacing:.16em;color:var(--sub);margin-bottom:8px}
.fs-side.ac h4,.fs-side.ac .eq{color:#bdb9b0}
.fs .path{font:600 13px/1.5 var(--mono);overflow-wrap:anywhere;letter-spacing:0;max-width:none}
.fs .eq{font-size:12px;color:var(--sub);margin:8px 0 2px}
.fs-mid{text-align:center;font:600 12px var(--mono)}
.fs-mid i{display:block;font:800 22px var(--latin);color:var(--accent);font-style:normal}
@media (max-width:620px){.fs{grid-template-columns:1fr}.fs-mid{padding:8px 0;display:flex;justify-content:center;gap:8px;align-items:center}.fs-mid i{transform:rotate(90deg)}}

/* ---------- ssh sequence ---------- */
.seq{border:1px solid var(--line);background:var(--white);padding:16px 20px}
.seq-h{display:flex;justify-content:space-between;font:600 11px var(--latin);letter-spacing:.16em;padding-bottom:6px}
.seq-b{border-left:2px solid var(--ink);border-right:2px solid var(--ink);padding:4px 0}
.msg{position:relative;padding:10px 16px 20px;font-size:14px;line-height:1.6}
.msg b{font-family:var(--latin);color:var(--accent);margin-right:8px}
.msg::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:2px;background:var(--ink)}
.msg::before{content:"";position:absolute;bottom:5px;border:5px solid transparent}
.msg.r::before{right:0;border-left:9px solid var(--ink);border-right:0}
.msg.l{text-align:right}
.msg.l::before{left:0;border-right:9px solid var(--ink);border-left:0}
.msg.ac::after{background:var(--accent)}
.msg.ac.l::before{border-right-color:var(--accent)}

/* ---------- alias ---------- */
.alias{display:grid;grid-template-columns:auto 40px 1fr;align-items:center;border:1px solid var(--line);background:var(--white);padding:16px}
.alias .tagb{background:var(--accent);color:#fff;font:700 15px var(--mono);padding:6px 14px;text-align:center}
.alias .eqs{text-align:center;font:800 22px var(--latin)}
.alias code{background:none;border:1px solid var(--ink);padding:6px 10px;font-size:13px}
@media (max-width:620px){.alias{grid-template-columns:1fr}.alias .eqs{line-height:1.4}}
.route.two{grid-template-columns:1fr 120px 1fr}
@media (max-width:620px){.route.two{grid-template-columns:1fr}}

/* ---------- commit graph ---------- */
.gwrap{overflow-x:auto;border:1px solid var(--line);background:var(--white);padding:14px 8px 4px}
.gcanvas{position:relative;margin:0 auto}
.gcanvas svg{display:block;overflow:visible}
.ge{fill:none;stroke:var(--ink);stroke-width:2.5}
.ge.new{stroke:var(--accent)}
.gn circle{fill:var(--white);stroke:var(--ink);stroke-width:2.5}
.gn.cur circle{fill:var(--ink)}
.gn.new circle{stroke:var(--accent);fill:var(--accent-weak)}
.gn.new.cur circle{fill:var(--accent)}
.gn text{font:600 10px var(--mono);fill:var(--mute);text-anchor:middle}
.gn{transform-box:fill-box;transform-origin:center}
.gtag{position:absolute;transform:translateX(-50%);font:600 11px/1.7 var(--mono);padding:0 7px;background:var(--ink);color:var(--paper);white-space:nowrap;letter-spacing:0}
.gtag.head{background:var(--accent);color:#fff}
.gtag i{font-style:normal;font-weight:400;margin-right:4px;opacity:.85}
.gtag.moved{outline:2px solid var(--accent);outline-offset:2px}
.gstx{border:1px solid var(--line);background:var(--white);padding:16px}
.gstx .gwrap{background:var(--paper)}
.gleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--sub);margin-top:10px}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.gleg i.f{background:var(--ink)}
.gleg b{font:600 11px var(--mono);background:var(--ink);color:var(--paper);padding:0 6px}
.gleg b.h{background:var(--accent)}

/* ---------- branch simulator ---------- */
.bsim{border:1px solid var(--ink);background:var(--white)}
.bsim .gwrap{border:0;border-bottom:1px solid var(--ink);background:var(--paper);min-height:190px;padding-top:20px}
.bsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bsel select{font:600 13px var(--mono);padding:7px 8px;border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.bsim .sim-commit{flex:0 1 240px}
.bhead{padding:8px 14px;font:600 12px var(--mono);border-bottom:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.bhead span b{color:var(--accent)}

/* ---------- team cycle ---------- */
.cyc{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;position:relative}
.cyc-h{grid-row:1;font:600 11px var(--latin);letter-spacing:.16em;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.cs{border:1px solid var(--ink);background:var(--white);padding:10px 12px;font-size:13px;line-height:1.6}
.cs.gh{border-style:dashed;background:var(--paper)}
.cs b{font:800 13px var(--latin);color:var(--accent);margin-right:8px}
.cs code{font-size:12px;background:none;padding:0;font-weight:600}
.cs small{display:block;color:var(--sub);font-size:12px}
.cs-back{grid-column:1/3;text-align:center;font:600 12px var(--latin);color:var(--sub);letter-spacing:.06em}
@media (max-width:620px){.cyc{grid-template-columns:1fr}.cyc-h{display:none}.cs{grid-column:1!important;grid-row:auto!important}.cs.gh::before{content:"GitHub";font:600 10px var(--latin);letter-spacing:.14em;color:var(--sub);display:block}.cs.pc::before{content:"YOUR PC";font:600 10px var(--latin);letter-spacing:.14em;color:var(--sub);display:block}.cs-back{grid-column:1}}

/* ---------- PR mock ---------- */
.prm{border:1px solid var(--ink);background:var(--white)}
.prm-top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.prm-top h4{font-size:18px;line-height:1.5}
.prm-top h4 span{color:var(--mute);font-family:var(--latin);font-weight:500}
.prm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:6px}
.prm-state{background:var(--ok);color:#fff;font:700 12px var(--latin);padding:2px 10px}
.prm-meta code{font-size:12px}
.prm-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);font:500 13px var(--latin);overflow-x:auto}
.prm-tabs span{padding:8px 14px;white-space:nowrap}
.prm-tabs span.on{border-bottom:2px solid var(--accent);font-weight:700}
.prm-body{padding:14px 16px;font-size:14px}
.prm-merge{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--paper);font-size:13px}
.prm-merge .ok{color:var(--ok);font-weight:700}
.prm-merge .ng{color:var(--accent);font-weight:700}
.prm-merge span.btn-mock{background:var(--ok);color:#fff;font:700 13px var(--latin);padding:6px 14px}
.prm-merge span.btn-mock.off{background:var(--line);color:var(--sub)}

/* ---------- conflict ---------- */
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf>div{border:1px solid var(--ink);background:var(--white);padding:12px 14px;text-align:center}
.conf .all{grid-column:1/3}
.conf .lbl{font:600 11px var(--latin);letter-spacing:.14em;color:var(--sub);margin-bottom:6px}
.conf code{background:none;padding:0;font-size:13px;font-weight:600}
.conf .q{background:var(--accent);border-color:var(--accent);color:#fff}
.conf .q .lbl{color:#fff;opacity:.8}
.conf .ar{border:0;background:none;padding:0;font:800 18px var(--latin);color:var(--accent);line-height:1}
.mk{border:1px solid var(--ink);font:13px/1.7 var(--mono);letter-spacing:0}
.mk-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.mk-row:last-child{border-bottom:0}
.mk-row code{background:none;padding:6px 12px;white-space:pre;overflow-x:auto;font-size:13px;word-break:normal}
.mk-row span{padding:6px 12px;font:12.5px/1.6 var(--jp);color:var(--sub);border-left:1px solid var(--line)}
.mk-row.mine{background:#eef1ea}
.mk-row.theirs{background:#eceef3}
.mk-row.m code{color:var(--accent);font-weight:700}
@media (max-width:620px){.mk-row{grid-template-columns:1fr}.mk-row span{border-left:0;padding-top:0}.mk-row span:empty{display:none}}
.term-b .srcl{color:var(--code-text)}
.term-b .mkr{color:#ffb4a6;font-weight:600}

/* ---------- kanban / issues ---------- */
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kb>div{background:var(--white);border:1px solid var(--line);padding:10px;min-height:150px}
.kb h5{font:700 12px var(--latin);letter-spacing:.1em;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:8px;display:flex;justify-content:space-between}
.kb h5 span{color:var(--mute)}
.kc{border:1px solid var(--ink);background:var(--paper);padding:6px 8px;font-size:12.5px;line-height:1.5;margin-bottom:6px}
.kc small{display:block;color:var(--mute);font:600 11px var(--latin)}
@media (max-width:560px){.kb{grid-template-columns:1fr}.kb>div{min-height:0}}
.iss{border:1px solid var(--ink);background:var(--white)}
.iss>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.iss>div:last-child{border-bottom:0}
.iss .no{font:600 12px var(--latin);color:var(--mute)}
.iss .st{width:12px;height:12px;border-radius:50%;border:2px solid var(--ok)}
.iss .st.closed{background:var(--mute);border-color:var(--mute)}
.iss .lab{font:600 11px var(--latin);border:1px solid var(--ink);padding:0 6px}

/* ---------- practice ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 13px var(--jp);padding:5px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.chips button:hover{background:var(--white)}
.chips button.on{background:var(--ink);color:var(--paper)}
.pq-map{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0 32px}
.pq-map button{width:34px;height:34px;border:1px solid var(--line);background:transparent;font:600 12px var(--latin);cursor:pointer;color:var(--sub)}
.pq-map button:hover{border-color:var(--ink)}
.pq-map button.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pq-map button.ng{border-color:var(--accent);color:var(--accent)}
.pq-map button.cur{outline:2px solid var(--accent);outline-offset:2px}
.pq-kind{display:inline-block;font:700 11px var(--latin);letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:3px 10px;margin-top:14px}
.pq-q{font-size:clamp(20px,3vw,26px);line-height:1.6;margin:14px 0 28px;font-weight:700}
.pq-q code{font-size:.8em}
.pq-form{display:flex;flex-wrap:wrap;gap:10px}
.pq-input{flex:1 1 320px;display:flex;align-items:center;background:var(--code);padding:0 14px;min-width:0}
.pq-input span{color:var(--accent);font:600 16px var(--mono);margin-right:10px}
.pq-input input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:600 16px var(--mono);padding:14px 0;letter-spacing:0}
.pq-input input:focus{outline:none}
.pq-input:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pq-input input::placeholder{color:#6d6b64;font-family:var(--jp);font-weight:400}
.pq-choices{display:grid;gap:8px}
.pq-choices button{display:grid;grid-template-columns:32px 1fr;align-items:center;text-align:left;border:1px solid var(--ink);background:var(--white);padding:12px 14px;font:15px/1.6 var(--jp);color:var(--ink);cursor:pointer;transition:background .15s}
.pq-choices button:hover:not(:disabled){background:var(--paper)}
.pq-choices button>span:first-child{font:800 14px var(--latin)}
.pq-choices button:disabled{cursor:default}
.pq-choices button.ok{border-color:var(--ok);outline:2px solid var(--ok);outline-offset:-3px}
.pq-choices button.ok>span:first-child{color:var(--ok)}
.pq-choices button.ng{border-color:var(--accent);background:var(--accent-weak)}
.pq-choices button.ng>span:first-child{color:var(--accent)}
.pq-choices button.dim{opacity:.45}
.pq-fb{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--white);padding:14px 18px}
.pq-fb.ok{border-left-color:var(--ok)}
.pq-fb.ans{border-left-color:var(--ink)}
.pq-fb>*+*{margin-top:8px}
.pq-fbh{font:800 16px var(--jp)}
.pq-fb.ok .pq-fbh{color:var(--ok)}
.pq-fb.ng .pq-fbh{color:var(--accent)}
.pq-fb .btn{padding:8px 16px;font-size:13px}
.pq-ref a{font-size:14px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--ink)}
.pq-ref a:hover{color:var(--accent);border-color:var(--accent)}
.pq-score{font:500 14px var(--latin);color:var(--sub);margin:-8px 0 16px}
.pq-score b{font:800 40px var(--latin);color:var(--ink);letter-spacing:-.03em;margin-right:4px}
.pq-help{font-size:13.5px;color:var(--sub);line-height:1.8;border-top:1px solid var(--ink);padding-top:12px}
.pq-help b{color:var(--ink)}
@media (max-width:900px){.pq-score{grid-column:2;margin:0}.pq-help{display:none}}

/* ---------- errors ---------- */
.esearch{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);background:var(--white);padding:0 14px;margin:8px 0 12px}
.esearch:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.esearch input{flex:1;min-width:0;border:0;background:transparent;font:15px var(--jp);padding:13px 0;color:var(--ink)}
.esearch input:focus{outline:none}
.elist{margin-top:24px;border-top:1px solid var(--ink)}
.err{border-bottom:1px solid var(--line)}
.err summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr 28px;gap:4px 12px;padding:14px 0;align-items:start}
.err summary::-webkit-details-marker{display:none}
.err summary::after{content:"+";grid-column:2;grid-row:1/4;font:400 24px/1 var(--latin);text-align:center;transition:transform .2s}
.err[open] summary::after{transform:rotate(45deg);color:var(--accent)}
.err-cat{font:600 11px var(--latin);letter-spacing:.12em;color:var(--sub)}
.err-t{font-weight:700;font-size:16px;line-height:1.6}
.err-m1{background:none;padding:0;font-size:12.5px;color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.err summary:hover .err-t{text-decoration:underline;text-underline-offset:4px}
.err-b{padding:4px 0 24px}
.err-b>*+*{margin-top:16px}
.err-msg{background:var(--code);color:#ffb4a6;font:13px/1.75 var(--mono);padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;letter-spacing:0}
.err-h{font-size:15px;display:flex;align-items:baseline;gap:10px}
.err-h::before{content:"";width:10px;height:10px;background:var(--accent)}
.err-b ul{padding-left:1.2em}
.err-b li+li{margin-top:2px}
.enone{padding:24px 0;color:var(--sub)}

/* ---------- pager ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;border-top:1px solid var(--ink);padding-top:20px}
.pager a,.pager button{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:14px 16px;border:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .2s,background .2s}
.pager a:hover,.pager button:hover{border-color:var(--ink);background:var(--white)}
.pager small{font-family:var(--latin);font-size:11px;letter-spacing:.16em;color:var(--sub);font-weight:600}
.pager b{font-size:15px}
.pager .next{text-align:right;align-items:flex-end;grid-column:2}
.pager .finish{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pager .finish small{color:#bdb9b0}
.pager .finish:hover{background:var(--accent);border-color:var(--accent)}

/* ---------- simulator ---------- */
.sim{border:1px solid var(--ink);background:var(--white)}
.sim-bar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--ink);align-items:center}
.sim-bar button{font:600 13px var(--mono);letter-spacing:0;padding:8px 12px;border:1px solid var(--ink);background:var(--white);cursor:pointer;color:var(--ink);transition:background .15s,color .15s}
.sim-bar button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.sim-bar button:disabled{opacity:.35;cursor:not-allowed}
.sim-bar button.jp{font-family:var(--jp);font-weight:700}
.sim-bar button.reset{margin-left:auto;border-color:var(--line);color:var(--sub);font-family:var(--jp);font-weight:500}
.sim-commit{display:flex;flex:1 1 260px;min-width:0}
.sim-commit input{flex:1;min-width:0;font:14px var(--jp);padding:7px 10px;border:1px solid var(--ink);border-right:0;background:var(--paper);color:var(--ink)}
.sim-commit input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.sim-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.sim-col{padding:12px;border-right:1px solid var(--line);min-height:220px;min-width:0}
.sim-col:last-child{border-right:0;background:var(--paper)}
.sim-col h5{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.3;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:10px}
.sim-col h5 span{font-family:var(--latin);font-weight:800;font-size:18px}
.sim-col h5 small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.sim-empty{font-size:12px;color:var(--mute);padding:6px 0}
.fcard{border:1px solid var(--ink);background:var(--white);padding:8px;margin-bottom:6px;font-size:12px}
.fcard .fn{font-family:var(--mono);font-weight:600;font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;overflow-wrap:anywhere}
.fcard .tag{font-family:var(--latin);font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border:1px solid currentColor;white-space:nowrap;align-self:flex-start}
.fcard .tag.u{color:var(--accent)}
.fcard .tag.m{color:#b0700f}
.fcard .tag.c{color:var(--mute)}
.fcard .ver{color:var(--sub);font-family:var(--mono);font-size:11px}
.fcard .acts{display:flex;gap:4px;margin-top:6px}
.fcard .acts button{flex:1;font:600 11px var(--mono);padding:4px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.fcard .acts button:hover:not(:disabled){border-color:var(--ink);background:var(--ink);color:var(--paper)}
.fcard .acts button:disabled{opacity:.35;cursor:not-allowed}
.ccard{border-left:3px solid var(--ink);background:var(--white);padding:6px 8px;margin-bottom:6px;font-size:12px;line-height:1.5}
.sim-col:last-child .ccard{background:var(--white)}
.ccard .id{font-family:var(--mono);font-weight:600;color:var(--accent)}
.ccard .ref{font-family:var(--mono);font-size:10px;font-weight:600;background:var(--ink);color:var(--paper);padding:0 4px;margin-left:4px}
.ccard .msg{display:block;word-break:break-all}
.sim-note{padding:12px 14px;border-top:1px solid var(--ink);font-size:14px;display:grid;grid-template-columns:24px 1fr;min-height:52px;background:var(--paper)}
.sim-note::before{content:"→";font-family:var(--latin);font-weight:800;color:var(--accent)}
.sim .term{border-top:1px solid var(--ink)}
.sim .term-b{height:180px;overflow-y:auto}
.fly{position:fixed;z-index:200;pointer-events:none;border:1px solid var(--accent);background:var(--accent-weak);padding:6px 8px;font:600 12px var(--mono);color:var(--ink)}
.mission{border-top:1px solid var(--ink)}
.mission li{list-style:none;display:grid;grid-template-columns:28px 1fr;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;transition:color .3s}
.mission li::before{content:"";width:14px;height:14px;border:1px solid var(--ink);margin-top:6px}
.mission li.ok{color:var(--mute);text-decoration:line-through}
.mission li.ok::before{background:var(--accent);border-color:var(--accent)}
@media (max-width:760px){
  .sim-grid{grid-template-columns:1fr 1fr}
  .sim-col{min-height:150px}
  .sim-col:nth-child(2){border-right:0}
  .sim-col:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .sim-bar button.reset{margin-left:0}
}
